name: repro

# Nodo Linux efimero para reproducir una capsula de seguridad sobre un sujeto OSS.
#
# Por que existe: la cuenta no tiene minutos de Actions en repositorios privados
# (medido 25-Nov-2026: el job no arranca, 0 pasos). Los repositorios publicos no
# consumen esos minutos. Lo que NO puede ser publico es el payload: por eso el
# trabajo entra por secretos y la salida publica es un codigo de retorno.
#
# Lo que este archivo declara y lo que no:
#   - declara COMO se construye el sujeto (receta publica, la misma de jobs/*.sh)
#   - NO declara el cuerpo del datagrama, ni los assert, ni el locus del fallo
#   - publica rc_repro y cuantos assert pasaron, nada mas
#
# `modo: asan` construye el MISMO sujeto con sanitizador para que una lectura
# fuera de limites pase de silencio a informe. Del informe se publica la clase y
# el tamano; el locus va CIFRADO (`recibo_cifrado`), porque el sujeto esta bajo
# embargo hasta el parche. Sin la clave, esa linea no revela nada.
on:
  workflow_dispatch:
    inputs:
      capsula:
        description: "capsula a ejecutar (dynolog-ipc-dos)"
        required: true
        default: dynolog-ipc-dos
      modo:
        description: "instrumento: normal | asan"
        required: true
        default: normal

permissions:
  contents: read

concurrency:
  group: repro-${{ github.event.inputs.capsula }}-${{ github.event.inputs.modo }}
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAPSULA: ${{ github.event.inputs.capsula }}
      MODO: ${{ github.event.inputs.modo }}
    steps:
      - name: nodo y herramientas
        run: |
          uname -srm
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make python3
          cmake --version | head -1
          g++ --version | head -1

      - name: materializar la capsula desde el secreto
        env:
          PAQUETE_B64: ${{ secrets.CAPSULA_TGZ_B64 }}
        run: |
          set -euo pipefail
          [ -n "${PAQUETE_B64:-}" ] || { echo "sin paquete: el secreto CAPSULA_TGZ_B64 no esta puesto"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/c"
          printf '%s' "$PAQUETE_B64" | base64 -d | tar -xzf - -C "$RUNNER_TEMP/c"
          ls -1 "$RUNNER_TEMP/c/jobs"

      - name: cruzar la frontera
        env:
          RECIBO_CLAVE: ${{ secrets.RECIBO_CLAVE }}
        run: |
          set -uo pipefail
          case "$CAPSULA" in
            dynolog-ipc-dos) GUION="$RUNNER_TEMP/c/jobs/repro_dynolog_ipc.sh" ;;
            *) echo "capsula desconocida: $CAPSULA"; exit 2 ;;
          esac
          case "${MODO:-normal}" in
            asan) export DYNO_SANITIZAR=asan ;;
            *)    export DYNO_SANITIZAR=ninguno ;;
          esac
          SALIDA="$RUNNER_TEMP/salida.txt"
          set +e
          bash "$GUION" > "$SALIDA" 2>&1
          RC=$?
          set -e
          echo "rc_repro=$RC"
          echo "modo=${MODO:-normal}"
          echo "asserts_pass=$(grep -c '^PASS' "$SALIDA" || true)"
          echo "asserts_fail=$(grep -c '^FAIL' "$SALIDA" || true)"
          # Nombres de aserto, no evidencia: dicen QUE invariante no se sostuvo.
          grep '^FAIL' "$SALIDA" | sed 's/^FAIL  //' | cut -c1-90 || true
          echo "--- lineas no reveladoras (sin evidencia ni locus) ---"
          grep -E '^(no_medido|no_corrida|no_aplica|apta_build|falta|motivo|pid|via de root|sanitizador|blanco|binario|bytes):|^(log|sonda|control|muerte_con|rastro|asan)' "$SALIDA" || true
          # El locus no se publica: se cifra. La clave vive en un secreto y no
          # viaja a este registro, asi que la linea es opaca para quien la lea.
          R=/tmp/asan_recibo.txt
          if [ ! -s "$R" ]; then
            echo "recibo_cifrado: no (esta corrida no produjo informe del sanitizador)"
          elif [ -z "${RECIBO_CLAVE:-}" ]; then
            echo "recibo_cifrado: no (falta el secreto RECIBO_CLAVE)"
          else
            BLOB=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                     -pass env:RECIBO_CLAVE -in "$R" -a -A 2>/dev/null || true)
            echo "recibo_cifrado: ${BLOB:-no (no se pudo cifrar)}"
          fi
          # Si el sujeto no construyo, la cola del intento es codigo del sujeto (upstream),
          # no del payload: publicarla es la unica forma de iterar la receta.
          if grep -q '^apta_build: false' "$SALIDA"; then
            echo "--- causa que nombra el compilador (sujeto, no payload) ---"
            sed -n '/causa declarada/,$p' "$SALIDA" | head -8
            echo "--- final del intento ---"
            sed -n '/ultimas lineas del intento/,$p' "$SALIDA" | tail -12
          fi
          # Un rc != 0 no es un fallo del workflow: es el resultado de la medicion.
          exit 0
